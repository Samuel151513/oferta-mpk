      break;
    case 'ready-second':
      el.innerHTML = '<div class="flex items-center gap-2.5 bg-[#2454d7] text-white rounded-full px-5 py-2.5 shadow-lg"><span class="opacity-80">' + icon('gift','w-4 h-4') + '</span><span class="font-bold text-sm">Tente novamente</span><span class="opacity-80">' + icon('gift','w-4 h-4') + '</span></div>';
      break;
    case 'exploding':
      el.innerHTML = '<div class="flex items-center gap-2 text-[#17305f]/80 rounded-full px-5 py-2.5"><span>' + icon('sparkles','w-4 h-4') + '</span><span class="font-semibold text-sm">Abrindo o seu presente...</span></div>';
      break;
    case 'red-ticket':
      el.innerHTML = '<div class="flex items-center gap-2 text-[#17305f]/80 rounded-full px-5 py-2.5"><span>' + icon('rotate-ccw','w-4 h-4') + '</span><span class="font-semibold text-sm">Preparando uma nova tentativa...</span></div>';
      break;
    case 'resetting':
      el.innerHTML = '<div class="flex items-center gap-2 text-[#17305f]/80 rounded-full px-5 py-2.5"><span>' + icon('rotate-ccw','w-4 h-4') + '</span><span class="font-semibold text-sm">Remontando o presente...</span></div>';
      break;
    case 'gold-ticket':
      el.innerHTML = '<a href="/loja/" onclick="sfx.celebrate()" class="flex items-center gap-2.5 bg-[#00A650] hover:bg-[#008c44] text-white rounded-full px-6 py-3 shadow-lg transition-colors no-underline"><span>' + icon('badge-percent','w-5 h-5') + '</span><span class="font-bold text-sm sm:text-base">Resgatar meu prêmio</span></a>';
      break;
  }
}

/* ── Explosion ── */
function spawnBurst(attempt) {
  const container = burst();
  container.innerHTML = '';
  const colors1 = ['#17305f','#f6c51e','#d81732','#ffffff'];
  const colors2 = ['#17305f','#f6c51e','#fff2a8','#c17a00'];
  const colors = attempt === 1 ? colors1 : colors2;

  // White flash
  const flash = document.createElement('div');
  flash.className = 'absolute rounded-full';
  flash.style.cssText = 'width:120px;height:120px;background:radial-gradient(circle,rgba(255,255,255,0.95),rgba(255,255,255,0));left:50%;top:50%;animation:flash-expand 700ms ease-out forwards;pointer-events:none';
  container.appendChild(flash);

  for (let i = 0; i < 30; i++) {
    const angle = (2 * Math.PI * i) / 30;
    const distance = 120 + (i % 6) * 22;
    const x = Math.cos(angle) * distance;
    const y = Math.sin(angle) * distance;
    const rotation = 160 + i * 37;
    const size = 6 + (i % 4) * 2;
    const h = (i % 3 === 0) ? size * 1.8 : size;
    const color = colors[i % colors.length];

    const p = document.createElement('div');
    p.className = 'absolute';
    p.style.cssText = 'width:' + size + 'px;height:' + h + 'px;background:' + color + ';border-radius:2px;left:50%;top:50%;margin-left:-' + (size/2) + 'px;margin-top:-' + (h/2) + 'px;--bx:' + x + 'px;--by:' + y + 'px;--br:' + rotation + 'deg;animation:burst-particle 850ms cubic-bezier(0.22,0.61,0.36,1) forwards;pointer-events:none';
    container.appendChild(p);
  }

  setTimeout(() => { container.innerHTML = ''; }, 900);
}

/* ── Phase transitions ── */
function handleOpen() {
  if (busy) return;
  if (phase !== 'ready-first' && phase !== 'ready-second') return;
  busy = true;
  sfx.reveal();

  const attempt = phase === 'ready-first' ? 1 : 2;
  const g = giftBtn();

  // Shake out
  g.style.animation = 'gift-shake-out 500ms ease-out forwards';
  renderPill('exploding');

  setTimeout(() => {
    spawnBurst(attempt);
  }, 400);

  setTimeout(() => {
    g.classList.add('hidden');
    if (attempt === 1) {
      showRedTicket();
    } else {
      showGoldTicket();
    }
  }, 650);
}

function showRedTicket() {
  phase = 'red-ticket';
  sfx.fail();
  const r = redTk();
  r.classList.remove('hidden');
  r.style.animation = 'ticket-enter 550ms cubic-bezier(0.34,1.56,0.64,1) forwards';

  // Insert rotate icon into ticket
  const iconSlot = document.getElementById('ticket-icon-slot');
  if (iconSlot) iconSlot.innerHTML = icon('rotate-ccw', 'w-9 h-9');

  renderPill('red-ticket');

  setTimeout(() => {
    startResetting();
  }, 2400);
}

function startResetting() {
  phase = 'resetting';
  const r = redTk();
  r.style.transition = 'opacity 0.4s ease-out';
  r.style.opacity = '0';
  renderPill('resetting');

  setTimeout(() => {
    r.classList.add('hidden');
    r.style.opacity = '';
    r.style.transition = '';
    r.style.animation = '';

    // Bring gift back
    const g = giftBtn();
    g.classList.remove('hidden');
    g.style.opacity = '1';
    g.style.animation = 'gift-reset-enter 600ms cubic-bezier(0.34,1.56,0.64,1) forwards';

    setTimeout(() => {
      phase = 'ready-second';
      busy = false;
      g.style.animation = 'idle-pulse 2.2s ease-in-out infinite';
      app().style.cursor = 'pointer';
      renderPill('ready-second');
    }, 650);
  }, 500);
}

function showGoldTicket() {
  phase = 'gold-ticket';
  sfx.win();
  const p = prizeEl();
  p.classList.remove('hidden');
  p.style.animation = 'ticket-enter 600ms cubic-bezier(0.34,1.56,0.64,1) forwards';
  app().style.cursor = 'default';
  renderPill('gold-ticket');
  busy = false;
}

/* ── Init ── */
document.addEventListener('DOMContentLoaded', function() {
  render();

  // Main click handler
  app().addEventListener('click', function(e) {
    // Don't intercept CTA link clicks
    if (e.target.closest('a[href]')) return;
    handleOpen();
  });
});
</script>
